name: Deploy na Hostinger (vocefashion.com.br)

# Publica o site (dist/) por FTP na Hostinger a cada push na main.
# Também pode ser disparado à mão: aba Actions → "Deploy na Hostinger" → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (raiz do domínio)
        run: npm run build

      - name: Confere o build
        run: |
          test -f dist/index.html
          test -f dist/.htaccess

      - name: Envia dist/ por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
          local-dir: ./dist/
          protocol: ftps
