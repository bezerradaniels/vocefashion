name: Build para a Hostinger (branch deploy)

# A Hostinger (hPanel → Avançado → GIT) copia os arquivos de uma branch para public_html,
# sem rodar build. Este workflow gera o site (dist/) a cada push na main e o publica
# na branch `deploy`, que é a branch que a Hostinger deve acompanhar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (raiz do domínio)
        run: npm run build

      - name: Confere o build
        run: |
          test -f dist/index.html
          test -f dist/.htaccess

      - name: Publica dist/ na branch deploy
        working-directory: dist
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
